<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瑞幸咖啡知识库问答</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f5f5f5;color:#333;height:100vh;display:flex;flex-direction:column}
.header{background:#003778;color:white;padding:16px 24px;text-align:center;flex-shrink:0}
.header h1{font-size:20px;font-weight:600}
.header p{font-size:13px;opacity:.8;margin-top:4px}
.chat-container{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.message{max-width:80%;padding:12px 16px;border-radius:12px;line-height:1.6;font-size:14px;word-wrap:break-word}
.message.user{align-self:flex-end;background:#003778;color:white;border-bottom-right-radius:4px}
.message.assistant{align-self:flex-start;background:white;border:1px solid #e0e0e0;border-bottom-left-radius:4px}
.sources{margin-top:8px;padding-top:8px;border-top:1px solid #eee;font-size:12px;color:#888}
.sources-title{font-weight:600;color:#666;margin-bottom:4px}
.source-item{margin-top:4px;padding:6px 8px;background:#f9f9f9;border-radius:6px;border-left:3px solid #003778}
.source-item .source-name{font-weight:600;color:#003778}
.input-area{padding:16px 24px;background:white;border-top:1px solid #e0e0e0;flex-shrink:0}
.input-wrapper{display:flex;gap:8px;max-width:800px;margin:0 auto}
.input-wrapper input{flex:1;padding:12px 16px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none}
.input-wrapper input:focus{border-color:#003778}
.input-wrapper button{padding:12px 24px;background:#003778;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.input-wrapper button:hover{background:#004ba0}
.input-wrapper button:disabled{background:#aaa;cursor:not-allowed}
.welcome{text-align:center;padding:40px 20px;color:#888}
.welcome h2{font-size:18px;color:#555;margin-bottom:12px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.suggestion-btn{padding:8px 16px;background:white;border:1px solid #ddd;border-radius:20px;font-size:13px;cursor:pointer;color:#555}
.suggestion-btn:hover{border-color:#003778;color:#003778}
.loading{display:flex;align-items:center;gap:8px;color:#888;font-size:13px}
.dot{animation:blink 1.4s infinite both}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
</style>
</head>
<body>
<div class="header">
<h1>瑞幸咖啡知识库问答</h1>
<p>基于 RAG 的企业知识智能检索系统</p>
</div>
<div class="chat-container" id="chatContainer">
<div class="welcome" id="welcomeScreen">
<h2>欢迎提问关于瑞幸咖啡的任何问题</h2>
<p>点击以下示例问题开始，或直接输入你自己的问题</p>
<div class="suggestions">
<button class="suggestion-btn" onclick="askSuggestion(this)">瑞幸咖啡是什么时候成立的？</button>
<button class="suggestion-btn" onclick="askSuggestion(this)">瑞幸咖啡的商业模式是什么？</button>
<button class="suggestion-btn" onclick="askSuggestion(this)">生椰拿铁为什么这么受欢迎？</button>
<button class="suggestion-btn" onclick="askSuggestion(this)">酱香拿铁的销量如何？</button>
<button class="suggestion-btn" onclick="askSuggestion(this)">瑞幸咖啡的主要竞争对手有哪些？</button>
<button class="suggestion-btn" onclick="askSuggestion(this)">瑞幸咖啡2024年的营收是多少？</button>
</div>
</div>
</div>
<div class="input-area">
<div class="input-wrapper">
<input type="text" id="questionInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')sendMessage()">
<button id="sendBtn" onclick="sendMessage()">发送</button>
</div>
</div>
<script>
var API_BASE = "http://localhost:8000";
var chatContainer = document.getElementById("chatContainer");
var questionInput = document.getElementById("questionInput");
var sendBtn = document.getElementById("sendBtn");
var welcomeScreen = document.getElementById("welcomeScreen");

function addMessage(role, content, sources) {
  if (welcomeScreen) welcomeScreen.style.display = "none";
  var div = document.createElement("div");
  div.className = "message " + role;
  var html = content.replace(/\n/g, "<br>");
  if (sources && sources.length > 0) {
    html += '<div class="sources"><div class="sources-title">参考来源：</div>';
    sources.forEach(function(s) {
      html += '<div class="source-item"><span class="source-name">'+s.source+'</span><br>'+s.content+'</div>';
    });
    html += "</div>";
  }
  div.innerHTML = html;
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function addLoading() {
  var div = document.createElement("div");
  div.className = "message assistant loading";
  div.id = "loadingMsg";
  div.innerHTML = "思考中 <span class=\"dot\">.</span><span class=\"dot\">.</span><span class=\"dot\">.</span>";
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function removeLoading() {
  var el = document.getElementById("loadingMsg");
  if (el) el.remove();
}

async function sendMessage() {
  var question = questionInput.value.trim();
  if (!question) return;
  questionInput.value = "";
  addMessage("user", question);
  sendBtn.disabled = true;
  sendBtn.textContent = "发送中...";
  addLoading();
  try {
    var resp = await fetch(API_BASE + "/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: question})
    });
    removeLoading();
    if (!resp.ok) {
      var err = await resp.json();
      addMessage("assistant", "\u274c " + (err.detail || "请求失败"));
      return;
    }
    var data = await resp.json();
    addMessage("assistant", data.answer, data.sources);
  } catch(e) {
    removeLoading();
    addMessage("assistant", "\u274c 无法连接到 API 服务，请确认服务已启动");
  }
  sendBtn.disabled = false;
  sendBtn.textContent = "发送";
}

function askSuggestion(btn) {
  questionInput.value = btn.textContent;
  sendMessage();
}
</script>
</body>
</html>
